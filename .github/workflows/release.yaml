name: Github Release

on:
    push:
        # Sequence of patterns matched against refs/tags
        tags:
            - '**' # Push events to matching  i.e. 1.0, 20.15.10, including hierarchical tags like v1.0/beta
            # Semver (https://semver.org/) release pattern.
            # - '[0-9]+.[0-9]+.[0-9]+*'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions: write-all

env:
    REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:

    # Build distribution release.
    #
    # Performs the following steps:
    # - Checks out the repository.
    # - Set up PHP.
    # - Install PHP Dependencies.
    # - Setup and Install Node.js.
    # - Make Zip.
    # - Upload Release.
    # On - `git tag $(node -p "require('./package.json').version") && git push origin "$_"`


    build:
        name: Release
        runs-on: ubuntu-latest
        steps:
            -   name: "Checks out the repository"
                uses: actions/checkout@v6

            -   name: "Set up PHP"
                uses: shivammathur/setup-php@v2
                with:
                    coverage: none
                    php-version: "8.3"

            -   name: "Setup and Install Node.js"
                uses: actions/setup-node@v6
                with:
                    node-version: '24.x'

            -   name: "NPM Install and Make Zip"
                run: npm install && npm run plugin-zip --if-present

            -   name: "Get release version."
                run: echo "RELEASE_TAG=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

            -   name: "Get release file base name."
                run: echo "RELEASE_NAME=$(node -p -e "require('./package.json').name.replace(/^@/, '').replace('/', '-').toLowerCase()")" >> $GITHUB_ENV

            -   name: "Get Changelog"
                id: changelog
                run: |
                    echo "changelog<<EOF" >> $GITHUB_OUTPUT
                    node ./tools/changelog.js >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT

            -   name: "Upload Release"
                uses: softprops/action-gh-release@v3
                with:
                    name: Release - v${{ env.RELEASE_TAG }}
                    tag_name: ${{ env.RELEASE_TAG }}
                    files: ./${{ env.RELEASE_NAME }}-v${{ env.RELEASE_TAG }}.zip
                    make_latest: true
                    overwrite_files: true
                    body: ${{ steps.changelog.outputs.changelog }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
